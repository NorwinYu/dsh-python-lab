[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "minidsh-headless"
version = "0.1.0"
description = "Headless command-line assembly for MiniDSH"
requires-python = ">=3.9"
dependencies = ["minidsh==0.1.0"]

[project.scripts]
minidsh-headless = "minidsh_headless:main"

[tool.setuptools.packages.find]
where = ["src"]
