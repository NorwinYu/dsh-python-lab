[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "minidsh"
version = "0.1.0"
description = "A dependency-free, layered agent harness in Python: plugin kernel, agent loop, tools, permissions, sessions, subagents, MCP, skills, schedule, goals, and PTC"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
desktop = ["pywebview>=5,<7"]

[project.scripts]
minidsh = "minidsh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"minidsh" = ["workflow_guest.js", "ptc_runner.js"]
"minidsh.web" = ["index.html"]
