[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "minidsh"
version = "0.1.0"
description = "A dependency-free, layered learning project inspired by DeepSeek Harness"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
minidsh = "minidsh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"minidsh.web" = ["index.html"]
